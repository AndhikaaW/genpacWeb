<body>
  <script>
    // SPA for GitHub Pages - redirect handler
    // Restores the URL from the query parameter set by 404.html
    (function() {
      var replaceStateSupported = !!window.history && !!window.history.replaceState;
      if (replaceStateSupported && window.location.search) {
        var search = window.location.search.substring(2);
        if (search) {
          var hash = search.replace(/~and~/g, '&');
          window.history.replaceState(null, '', hash);
        }
      }
    })();
  </script>
