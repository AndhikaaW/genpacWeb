<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback: redirect semua 404 ke index.html dengan path yang sama
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname + l.search + l.hash);
    </script>
  </head>
  <body></body>
</html>
