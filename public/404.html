<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Encode path sebagai query string lalu redirect ke root (index.html)
      // Teknik: https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
      );
    </script>
  </head>
  <body></body>
</html>
